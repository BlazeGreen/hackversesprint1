<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DESK — Multi-Agent Financial Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0D0F12;
    --panel: #15181D;
    --panel-raised: #1B1F26;
    --line: #2A2F38;
    --amber: #E8A33D;
    --amber-dim: #8A6A38;
    --bullish: #4FA88F;
    --bearish: #C7604C;
    --neutral: #8A93A3;
    --text: #EDEBE4;
    --text-dim: #8A8F99;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 34px;
  }
  .brand {
    font-family: 'Newsreader', serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.2px;
    color: var(--text);
  }
  .brand span { color: var(--amber); font-style: italic; }
  .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.4px;
  }

  /* ── Command bar (hero) ─────────────────────────────────── */
  .console {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 22px 24px;
    margin-bottom: 40px;
  }
  .console-row {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
  }
  .prompt-glyph { color: var(--amber); }
  select {
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 8px 10px;
  }
  select:focus { outline: 1px solid var(--amber); }
  .run-btn {
    margin-left: auto;
    background: var(--amber);
    color: #14110A;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 18px;
    cursor: pointer;
    letter-spacing: 0.4px;
  }
  .run-btn:hover { background: #f0b453; }
  .run-btn:disabled { background: var(--amber-dim); cursor: default; color: #2a2318; }
  .cursor {
    display: inline-block;
    width: 8px; height: 16px;
    background: var(--amber);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Agent grid ─────────────────────────────────────────── */
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.6px;
    margin-bottom: 12px;
  }
  .agent-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 40px;
  }
  @media (max-width: 860px) { .agent-grid { grid-template-columns: 1fr; } }

  .agent-card {
    background: var(--panel);
    padding: 20px;
    min-height: 190px;
    transition: box-shadow 0.4s ease;
  }
  .agent-card.filled { box-shadow: inset 3px 0 0 var(--amber); }
  .agent-card.pulse { animation: pulse-in 0.6s ease; }
  @keyframes pulse-in {
    0% { background: #26221a; }
    100% { background: var(--panel); }
  }
  .agent-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }
  .status-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 6px;
    border: 1px solid var(--line);
  }
  .status-tag.pending { color: var(--text-dim); }
  .status-tag.done { color: var(--amber); border-color: var(--amber-dim); }
  .status-tag.degraded { color: var(--bearish); border-color: var(--bearish); }

  .signal-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .signal-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    padding: 3px 8px;
  }
  .signal-badge.BULLISH { color: var(--bullish); border: 1px solid var(--bullish); }
  .signal-badge.BEARISH { color: var(--bearish); border: 1px solid var(--bearish); }
  .signal-badge.NEUTRAL { color: var(--neutral); border: 1px solid var(--neutral); }
  .signal-badge.UNKNOWN { color: var(--bearish); border: 1px dashed var(--bearish); }
  .confidence { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); }

  .reasoning {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    margin-bottom: 10px;
  }
  .sources {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  .placeholder-text { color: var(--text-dim); font-size: 13px; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Synthesis panel ────────────────────────────────────── */
  .synthesis {
    background: var(--panel);
    border: 1px solid var(--amber-dim);
    padding: 30px;
    margin-bottom: 40px;
    display: none;
  }
  .synthesis.visible { display: block; }
  .synth-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .rec-word {
    font-family: 'Newsreader', serif;
    font-size: 40px;
    font-weight: 500;
  }
  .rec-word.BUY { color: var(--bullish); }
  .rec-word.SELL, .rec-word.AVOID { color: var(--bearish); }
  .rec-word.HOLD { color: var(--amber); }
  .conf-bar-wrap {
    flex: 1;
    min-width: 160px;
  }
  .conf-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .conf-bar { height: 6px; background: var(--panel-raised); position: relative; }
  .conf-fill { height: 100%; background: var(--amber); width: 0%; transition: width 0.8s ease; }
  .synth-reasoning {
    font-family: 'Newsreader', serif;
    font-size: 17px;
    line-height: 1.65;
    color: var(--text);
    max-width: 72ch;
  }
  .flags { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .flag-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--bearish);
    border: 1px solid var(--bearish);
    padding: 4px 8px;
  }

  /* ── Bottom panels ──────────────────────────────────────── */
  .bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 24px;
  }
  @media (max-width: 860px) { .bottom-grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 20px;
  }
  .panel h3 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin: 0 0 14px;
    font-weight: 500;
  }
  .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--text-dim); }
  .kv .v { font-family: 'IBM Plex Mono', monospace; }

  .metrics-strip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding-top: 20px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand">DESK <span>/</span></div>
      <div class="sub">MULTI-AGENT FINANCIAL INTELLIGENCE · PS-01 · HACKVERSE 2026</div>
    </div>
    <div class="sub" id="model-tag">MODEL: local</div>
  </header>

  <div class="console">
    <div class="console-row">
      <span class="prompt-glyph">&gt;</span>
      <span>ANALYZE</span>
      <select id="ticker-select"></select>
      <span>FOR</span>
      <select id="profile-select"></select>
      <span class="cursor"></span>
      <button class="run-btn" id="run-btn">RUN</button>
    </div>
  </div>

  <div class="section-label">SPECIALIST AGENTS — RUNNING IN PARALLEL</div>
  <div class="agent-grid" id="agent-grid"></div>

  <div class="synthesis" id="synthesis-panel"></div>

  <div class="bottom-grid">
    <div class="panel">
      <h3>MARKET SIGNAL</h3>
      <div id="market-panel"><div class="placeholder-text">Run an analysis to populate.</div></div>
    </div>
    <div class="panel">
      <h3>USER PROFILE</h3>
      <div id="profile-panel"><div class="placeholder-text">Run an analysis to populate.</div></div>
    </div>
  </div>

  <div class="metrics-strip" id="metrics-strip"></div>

</div>

<script>
const API = "";
const AGENT_LABELS = {
  momentum_agent: "MOMENTUM",
  sentiment_agent: "SENTIMENT",
  filings_agent: "FILINGS (RAG)"
};
const AGENT_ORDER = ["momentum_agent", "sentiment_agent", "filings_agent"];

let tickerSelect = document.getElementById("ticker-select");
let profileSelect = document.getElementById("profile-select");
let runBtn = document.getElementById("run-btn");
let agentGrid = document.getElementById("agent-grid");
let synthPanel = document.getElementById("synthesis-panel");
let marketPanel = document.getElementById("market-panel");
let profilePanel = document.getElementById("profile-panel");
let metricsStrip = document.getElementById("metrics-strip");

function renderPendingGrid() {
  agentGrid.innerHTML = AGENT_ORDER.map(key => `
    <div class="agent-card" id="card-${key}">
      <div class="agent-name">
        <span>${AGENT_LABELS[key]}</span>
        <span class="status-tag pending" id="status-${key}">PENDING</span>
      </div>
      <div class="placeholder-text">Awaiting dispatch…</div>
    </div>
  `).join("");
}

async function init() {
  const tickers = await fetch(`${API}/tickers`).then(r => r.json());
  tickerSelect.innerHTML = tickers.tickers.map(t => `<option value="${t}">${t}</option>`).join("");

  const profiles = await fetch(`${API}/profiles`).then(r => r.json());
  profileSelect.innerHTML = Object.entries(profiles).map(
    ([id, p]) => `<option value="${id}">${p.name.toUpperCase()}</option>`
  ).join("");

  renderPendingGrid();
}

function fillAgentCard(result) {
  const key = result.agent;
  const card = document.getElementById(`card-${key}`);
  const statusTag = document.getElementById(`status-${key}`);
  if (!card) return;

  if (result.degraded) {
    statusTag.textContent = "DEGRADED";
    statusTag.className = "status-tag degraded";
  } else {
    statusTag.textContent = `${result.latency_ms}ms`;
    statusTag.className = "status-tag done";
  }

  card.classList.add("filled", "pulse");
  card.innerHTML = `
    <div class="agent-name">
      <span>${AGENT_LABELS[key]}</span>
      <span class="status-tag ${result.degraded ? 'degraded' : 'done'}">${result.degraded ? 'DEGRADED' : result.latency_ms + 'ms'}</span>
    </div>
    <div class="signal-row">
      <span class="signal-badge ${result.signal}">${result.signal}</span>
      <span class="confidence">${result.confidence}% confidence</span>
    </div>
    <div class="reasoning">${result.reasoning || ""}</div>
    <div class="sources">${(result.sources || []).join(", ")}</div>
  `;
}

function markAgentsRunning() {
  AGENT_ORDER.forEach(key => {
    const statusTag = document.getElementById(`status-${key}`);
    const card = document.getElementById(`card-${key}`);
    if (statusTag) {
      statusTag.innerHTML = `<span class="spinner"></span>`;
    }
  });
}

function renderSynthesis(s) {
  synthPanel.classList.add("visible");
  const rec = s.recommendation || "N/A";
  synthPanel.innerHTML = `
    <div class="synth-head">
      <div class="rec-word ${rec}">${rec}</div>
      <div class="conf-bar-wrap">
        <div class="conf-label">SYNTHESIS CONFIDENCE — ${s.confidence}%</div>
        <div class="conf-bar"><div class="conf-fill" style="width:${s.confidence}%"></div></div>
      </div>
    </div>
    <div class="synth-reasoning">${s.reasoning || ""}</div>
    ${(s.flags && s.flags.length) ? `<div class="flags">${s.flags.map(f => `<span class="flag-chip">${f}</span>`).join("")}</div>` : ""}
  `;
}

function renderContext(market, profile, log) {
  marketPanel.innerHTML = Object.entries(market).filter(([k]) => k !== "news_headlines").map(
    ([k, v]) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`
  ).join("");
  profilePanel.innerHTML = `
    <div class="kv"><span class="k">risk_tolerance</span><span class="v">${profile.risk_tolerance}</span></div>
    <div class="kv"><span class="k">horizon</span><span class="v">${profile.investment_horizon}</span></div>
    <div class="kv"><span class="k">holdings</span><span class="v">${(profile.current_holdings||[]).join(", ")}</span></div>
  `;
  metricsStrip.textContent =
    `TOTAL LATENCY ${log.total_latency_ms}ms  ·  CONCENTRATION SCORE ${log.portfolio_concentration_score}  ·  DEGRADED AGENTS: ${(log.degraded_agents||[]).join(", ") || "none"}`;
}

function runAnalysis() {
  const ticker = tickerSelect.value;
  const profileId = profileSelect.value;
  runBtn.disabled = true;
  runBtn.textContent = "RUNNING…";
  synthPanel.classList.remove("visible");
  renderPendingGrid();

  const es = new EventSource(`${API}/analyze_stream/${ticker}?profile_id=${profileId}`);

  es.onmessage = (e) => {
    const event = JSON.parse(e.data);
    if (event.type === "agents_started") {
      markAgentsRunning();
    } else if (event.type === "agent_result") {
      fillAgentCard(event.result);
    } else if (event.type === "synthesizing") {
      synthPanel.classList.add("visible");
      synthPanel.innerHTML = `<div class="placeholder-text"><span class="spinner"></span>&nbsp; Synthesizing across agents + user profile…</div>`;
    } else if (event.type === "synthesis") {
      renderSynthesis(event.result);
    } else if (event.type === "log") {
      renderContext(event.market_data, event.user_profile, {
        total_latency_ms: event.log_entry.total_latency_ms,
        portfolio_concentration_score: event.log_entry.portfolio_concentration_score,
        degraded_agents: event.log_entry.degraded_agents,
      });
    } else if (event.type === "done") {
      es.close();
      runBtn.disabled = false;
      runBtn.textContent = "RUN";
    }
  };

  es.onerror = () => {
    es.close();
    runBtn.disabled = false;
    runBtn.textContent = "RUN";
  };
}

runBtn.addEventListener("click", runAnalysis);
init();
</script>
</body>
</html>
